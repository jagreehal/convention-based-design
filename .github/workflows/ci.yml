name: ci
on: [push, pull_request]

jobs:
  demo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: npm ci --prefix payments-service
      - run: npm ci --prefix dashboard
      - run: npm ci --prefix catalog
      - run: ./demo.sh
      - run: npm run build --prefix catalog
      # Catch modified, deleted, and newly generated untracked files.
      - run: test -z "$(git status --porcelain --untracked-files=all)"
